<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050D1F"/>
      <stop offset="100%" style="stop-color:#0C1730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0369A1"/>
      <stop offset="100%" style="stop-color:#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Decorative circle -->
  <circle cx="980" cy="120" r="280" fill="#0EA5E9" fill-opacity="0.04"/>
  <circle cx="980" cy="120" r="180" fill="#0EA5E9" fill-opacity="0.05"/>

  <!-- Truck icon (simplified) -->
  <g transform="translate(80, 200)">
    <!-- Truck body -->
    <rect x="80" y="30" width="160" height="90" rx="8" fill="url(#accent)"/>
    <!-- Cab -->
    <rect x="240" y="50" width="80" height="70" rx="6" fill="#0EA5E9"/>
    <!-- Window -->
    <rect x="250" y="58" width="55" height="35" rx="4" fill="#050D1F" fill-opacity="0.6"/>
    <!-- Wheels -->
    <circle cx="130" cy="128" r="22" fill="#132244" stroke="#0EA5E9" stroke-width="4"/>
    <circle cx="130" cy="128" r="8" fill="#0EA5E9"/>
    <circle cx="270" cy="128" r="22" fill="#132244" stroke="#0EA5E9" stroke-width="4"/>
    <circle cx="270" cy="128" r="8" fill="#0EA5E9"/>
    <!-- Ground line -->
    <line x1="60" y1="150" x2="350" y2="150" stroke="#0EA5E9" stroke-width="2" stroke-opacity="0.3"/>
  </g>

  <!-- Company name -->
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#F1F5F9" letter-spacing="-1">GrandPro Moving</text>

  <!-- Tagline -->
  <text x="82" y="490" font-family="Arial, sans-serif" font-size="28" fill="#8B9BB4" letter-spacing="1">Профессиональный переезд в Алматы</text>

  <!-- Bottom accent bar -->
  <rect x="80" y="540" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- Contact -->
  <text x="80" y="590" font-family="Arial, sans-serif" font-size="24" fill="#0EA5E9">+7 707 709-74-22</text>
  <text x="400" y="590" font-family="Arial, sans-serif" font-size="24" fill="#475569">•</text>
  <text x="430" y="590" font-family="Arial, sans-serif" font-size="24" fill="#8B9BB4">grandpro.kz</text>

  <!-- Badge -->
  <rect x="900" y="540" width="220" height="44" rx="22" fill="#0369A1" fill-opacity="0.2" stroke="#0EA5E9" stroke-width="1" stroke-opacity="0.4"/>
  <text x="1010" y="568" font-family="Arial, sans-serif" font-size="18" fill="#0EA5E9" text-anchor="middle">Алматы, Казахстан</text>
</svg>
